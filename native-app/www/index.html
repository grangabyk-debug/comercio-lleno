<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5faf7" />
  <title>Comercio Lleno</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5faf7;color:#10251d}body{min-height:100vh;display:grid;place-items:center}.boot{display:grid;justify-items:center;gap:14px;text-align:center;padding:32px}.mark{width:76px;height:76px;border-radius:22px;background:#15965b;color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;box-shadow:0 18px 44px rgba(21,150,91,.22)}h1{font-size:21px;margin:0;font-weight:900;letter-spacing:-.03em}p{margin:0;color:#63736c;font-size:13px}.line{width:130px;height:4px;border-radius:99px;background:#dfe9e4;overflow:hidden}.line:after{content:"";display:block;width:45%;height:100%;background:#15965b;border-radius:99px;animation:load 1.05s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(120%)}}</style>
</head>
<body>
  <main class="boot">
    <div class="mark">CL</div>
    <div><h1>Comercio Lleno</h1><p>Preparando tu operación móvil…</p></div>
    <div class="line"></div>
  </main>
</body>
</html>
