name: Build Comercio Lleno Google Play

on:
  push:
    branches:
      - app/android-mobile-v1
    paths:
      - 'native-app/**'
      - '.github/workflows/build-android-play.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar configuración Play
        run: npm run android:prepare

      - name: Verificar configuración
        run: |
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "compileSdkVersion\|targetSdkVersion" android/variables.gradle
          grep -n "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Compilar Android App Bundle release
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Publicar AAB sin firma de subida
        uses: actions/upload-artifact@v4
        with:
          name: Comercio-Lleno-Google-Play-AAB-unsigned
          path: native-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
