name: Build Comercio Lleno Android Beta

on:
  push:
    branches:
      - app/android-mobile-v1
    paths:
      - 'native-app/**'
      - '.github/workflows/build-android-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Dependencias Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto nativo
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar identidad y permisos
        run: npm run android:prepare

      - name: Compilar APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK beta
        uses: actions/upload-artifact@v4
        with:
          name: Comercio-Lleno-Android-Beta
          path: native-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
